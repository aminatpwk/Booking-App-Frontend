<form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <h2 class="auth-form__title">Booking App platform entry</h2>

  <div class="auth-form__role-selector">
    <label class="auth-form__role-option">
      <input
        type="radio"
        name="role"
        value="User"
        [(ngModel)]="selectedRole"
        [ngModelOptions]="{standalone: true}"
      />
      <span>Login as User</span>
    </label>
    <label class="auth-form__role-option">
      <input
        type="radio"
        name="role"
        value="Owner"
        [(ngModel)]="selectedRole"
        [ngModelOptions]="{standalone: true}"
      />
      <span>Login as Owner</span>
    </label>
  </div>

  <div class="auth-form__fields">
    <div class="auth-form__field">
      <label class="auth-form__label" for="user-email">E-mail</label>
      <input
        class="auth-form__input"
        [class.auth-form__input--error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        id="user-email"
        type="email"
        formControlName="email"
      />
      @if (loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']) {
        <span class="auth-form__error">E-mail is required.</span>
      }
    </div>

    <div class="auth-form__field">
      <label class="auth-form__label" for="user-password">Password</label>
      <input
        class="auth-form__input"
        [class.auth-form__input--error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        id="user-password"
        type="password"
        formControlName="password"
      />
      @if (loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']) {
        <span class="auth-form__error">Password is required.</span>
      }
    </div>
  </div>

  <button class="btn btn--primary btn--lg btn--full" type="submit">Log In</button>

  <p class="auth-form__footer">
    Don't have an account? <a routerLink="/register">Register here.</a>
  </p>
</form>
